 $('#cursiveBack').onclick=()=>nav('cursive');$('#cursivePrev').onclick=()=>cursiveLesson((i+29)%30);$('#cursiveNext').onclick=()=>cursiveLesson((i+1)%30);$('#cursiveWrite').onclick=()=>openCursivePage(page);document.querySelectorAll('[data-cursive-answer]').forEach(b=>b.onclick=()=>{const correct=b.dataset.cursiveAnswer===letter;b.classList.toggle('good',correct);b.classList.toggle('bad',!correct);feedback(correct?'Тачно! Сада вежбај писање.':'Погледај облик још једном и покушај поново.');if(correct){document.querySelectorAll('[data-cursive-answer]').forEach(x=>x.disabled=true);award('c'+i+'-recognize')}});window.scrollTo(0,0);
}
function cursiveNormalize(s){const latin={'a':'а','b':'б','v':'в','g':'г','d':'д','đ':'ђ','e':'е','ž':'ж','z':'з','i':'и','j':'ј','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','r':'р','s':'с','t':'т','ć':'ћ','u':'у','f':'ф','h':'х','c':'ц','č':'ч','š':'ш'};return s.trim().toLowerCase().replace(/lj/g,'љ').replace(/nj/g,'њ').replace(/dž/g,'џ').replace(/[a-zđžćčš]/g,c=>latin[c]||c).replace(/[.!?]/g,'').trim()}
function cursivePuzzle(i,kind){stopAudio();cursiveTab='games';const p=cursivePuzzles[i],indices=kind==='riddle'?[0,1,2,3,4,5,15,16,17]:[6,7,8,9,10,11,12,13,14],position=indices.indexOf(i);app.innerHTML='<div class="sectionhead"><button id="cursiveGameBack" class="small">← Игре писаних слова</button><h2>'+(kind==='riddle'?'Загонетке':'Ребуси')+'</h2><span class="muted">'+(position+1)+' / '+indices.length+'</span></div><div class="workspace"><p class="eyebrow">ИЗ КЊИГЕ · СТРАНА '+p.page+'</p><p class="storytext">'+bookEsc(p.prompt)+'</p>'+(p.choices?'<div class="choices">'+shuffle(p.choices).map(c=>'<button class="choice word" data-puzzle-choice="'+c+'">'+c+'</button>').join(''):'<form id="cursivePuzzleForm"><label for="cursivePuzzleAnswer">Напиши решење</label><input id="cursivePuzzleAnswer" class="cursive-answer" autocomplete="off" maxlength="30"><button class="primary" type="submit">Провери</button></form>')+'<div id="feedback" class="feedback" role="status"></div><div class="controls"><button id="cursivePuzzleSource" class="secondary">Погледај оригинал и пиши решење</button><button id="cursivePuzzleNext" class="small">'+(position===indices.length-1?'Назад на игре':'Следећи задатак →')+'</button></div><p class="source">Задатак је из књиге; ребуси са сликама су овде описани речима. На оригиналној страници вежбај и писано решење.</p></div>';
 let finished=false;function check(value,b){if(finished)return;const good=p.answers.includes(cursiveNormalize(value));if(b)b.classList.toggle(good?'good':'bad',true);feedback(good?'Браво, тачно! Напиши решење писаним словима на страници из књиге.':'Покушај поново. Можеш да погледаш оригинални задатак.');if(good){finished=true;award('cq'+i);document.querySelectorAll('[data-puzzle-choice]').forEach(x=>x.disabled=true);const input=$('#cursivePuzzleAnswer');if(input)input.disabled=true;}}
 document.querySelectorAll('[data-puzzle-choice]').forEach(b=>b.onclick=()=>check(b.dataset.puzzleChoice,b));const form=$('#cursivePuzzleForm');if(form)form.onsubmit=e=>{e.preventDefault();check($('#cursivePuzzleAnswer').value)};$('#cursiveGameBack').onclick=()=>nav('cursive');$('#cursivePuzzleSource').onclick=()=>openCursivePage(p.page);$('#cursivePuzzleNext').onclick=()=>position===indices.length-1?nav('cursive'):cursivePuzzle(indices[position+1],kind);window.scrollTo(0,0);
}

function nativeKidProp(g){return ({73:'fish',77:'letters',79:'crossword',80:'letters',87:'book',88:'tent',92:'letters',95:'rabbit',96:'search',99:'book',100:'maze',103:'fruit',104:'letters',108:'bell',112:'book',115:'fruit',116:'search',119:'speech',120:'bird',122:'punctuation',123:'light',124:'envelope'})[g.id]||'book'}

let installPrompt=null;
let offlineState={phase:'loading',completed:0,total:0};
let pwaRegistration=null;
const pwaStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;refreshPWAUI()});
window.addEventListener('appinstalled',()=>{installPrompt=null;refreshPWAUI()});
function offlineText(){const s=offlineState;if(s.phase==='ready')return '✓ Све игре, слике, снимци и странице су преузети. Апликација је спремна за рад без интернета.';if(s.phase==='downloading')return 'Преузимање: '+s.completed+' / '+s.total+' датотека. Останите у апликацији док се преузимање не заврши.';if(s.phase==='loading')return 'Проверавамо рад без интернета…';if(s.phase==='unsupported')return 'За инсталацију отворите објављени сајт у Chrome или Safari прегледачу.';if(s.phase==='error')return (s.message||'Преузимање није завршено.')+(s.missing?.length?' Недостаје '+s.missing.length+' датотека.':'');return 'Преузмите цео буквар једном, док имате интернет. Укључене су све слике, анимације, гласови, видео-приче и 160 страна књиге (око 33 MB).'}
function refreshPWAUI(){const top=document.getElementById('installApp');if(top){top.hidden=pwaStandalone();top.onclick=installBukvar}const status=document.getElementById('offlineStatus');if(status)status.textContent=offlineText();const bar=document.getElementById('offlineProgress');if(bar){bar.hidden=offlineState.phase!=='downloading';bar.max=offlineState.total||1;bar.value=offlineState.completed||0}const button=document.getElementById('downloadOffline');if(button){button.disabled=['loading','downloading','ready','unsupported'].includes(offlineState.phase);button.textContent=offlineState.phase==='ready'?'✓ Преузето':offlineState.phase==='downloading'?'Преузимање…':offlineState.phase==='error'?'Настави преузимање':'Преузми за рад без интернета'}const install=document.getElementById('installBukvarButton');if(install){install.disabled=pwaStandalone();install.textContent=pwaStandalone()?'✓ Апликација је инсталирана':'Додај на телефон';install.onclick=installBukvar}}
function pwaMessage(type,onMessage){if(!pwaRegistration?.active){offlineState={phase:'error',message:'Апликација још није спремна. Освежите страницу и покушајте поново.'};refreshPWAUI();return}const channel=new MessageChannel();channel.port1.onmessage=event=>{onMessage(event.data);if(!['downloading','busy'].includes(event.data.phase))channel.port1.close()};pwaRegistration.active.postMessage({type},[channel.port2])}
async function setupPWA(){refreshPWAUI();if(!('serviceWorker'in navigator)||!isSecureContext||!/^https?:$/.test(location.protocol)){offlineState={phase:'unsupported'};refreshPWAUI();return}try{const existing=await navigator.serviceWorker.getRegistration(location.href);if(!navigator.onLine&&existing?.active){pwaRegistration=existing}else{const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});const installing=registration.installing;if(installing&&installing.state!=='activated')await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('Activation timeout')),30000);const check=()=>{if(installing.state==='activated'){clearTimeout(timeout);resolve()}else if(installing.state==='redundant'){clearTimeout(timeout);reject(Error('Installation failed'))}};installing.addEventListener('statechange',check);check()});pwaRegistration=await navigator.serviceWorker.ready;}pwaMessage('STATUS',message=>{offlineState=message;refreshPWAUI()})}catch(e){offlineState={phase:'error',message:'Инсталација није спремна. Проверите да су све датотеке за апликацију постављене уз index.html.'};refreshPWAUI()}}
async function downloadBukvarOffline(){if(['downloading','ready'].includes(offlineState.phase))return;try{await navigator.storage?.persist?.()}catch(e){}offlineState={phase:'downloading',completed:0,total:0};refreshPWAUI();pwaMessage('DOWNLOAD',message=>{if(message.phase==='busy'){offlineState={phase:'error',message:message.message};refreshPWAUI();return}offlineState=message;refreshPWAUI();if(message.phase==='ready')document.getElementById('live').textContent='Буквар је преузет и спреман за рад без интернета.'})}
async function installBukvar(){if(installPrompt){const prompt=installPrompt;installPrompt=null;await prompt.prompt();await prompt.userChoice;refreshPWAUI();return}showInstallHelp()}
function showInstallHelp(){if(document.getElementById('installHelpDialog'))return;const dialog=document.createElement('dialog');dialog.id='installHelpDialog';dialog.className='badge-popup';dialog.setAttribute('aria-labelledby','installHelpTitle');dialog.innerHTML='<div class="badge-popup-head"><h2 id="installHelpTitle">Буквар на телефону</h2><button class="small" id="closeInstallHelp" aria-label="Затвори" autofocus>✕</button></div><p><strong>Android:</strong> у Chrome менију ⋮ изаберите „Инсталирај апликацију“ или „Додај на почетни екран“.</p><p><strong>iPhone / iPad:</strong> у Safari изаберите „Подели“ → „Додај на почетни екран“ → „Додај“. Укључите „Отвори као веб-апликацију“ ако је понуђено.</p><p>За рад без интернета: отворите „За родитеље“ и притисните „Преузми за рад без интернета“. Сачекајте потврду да су све датотеке преузете.</p><button class="primary" id="installHelpDone">Разумем</button>';document.body.append(dialog);const close=()=>dialog.close();dialog.querySelector('#closeInstallHelp').onclick=dialog.querySelector('#installHelpDone').onclick=close;dialog.addEventListener('close',()=>dialog.remove(),{once:true});dialog.showModal()}
function renderPWAPanel(){const panel=document.createElement('section');panel.className='tracking-panel pwa-panel';panel.innerHTML='<h3>Буквар као апликација на телефону</h3><p>Додајте Буквар на почетни екран и преузмите све игре за рад без интернета. Звездице и радови се чувају на овом уређају.</p><div class="controls" style="justify-content:flex-start"><button class="primary" id="installBukvarButton">Додај на телефон</button><button class="secondary" id="downloadOffline">Преузми за рад без интернета</button></div><progress id="offlineProgress" hidden></progress><p id="offlineStatus" role="status" aria-live="polite"></p><p class="muted">После додавања иконе, прво преузимање обавите из апликације отворене том иконом. То омогућава да и инсталирана апликација има све датотеке.</p>';document.getElementById('app').prepend(panel);document.getElementById('downloadOffline').onclick=downloadBukvarOffline;refreshPWAUI()}
const parentBeforePWA=parent;parent=function(){parentBeforePWA();renderPWAPanel()};

document.addEventListener('click',e=>{let b=e.target.closest('[data-nav]');if(b)nav(b.dataset.nav)});$('#sound').onclick=()=>{state.sound=!state.sound;if(state.sound){unlockAudio();tone()}else stopAudio();save()};$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('#live').textContent='Приказ преко целог екрана није доступан.'}};header();home();setupTracking();renderSplash();setupPWA();
