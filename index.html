.poem-reading.garden-page{position:relative;isolation:isolate;grid-template-columns:minmax(0,1.2fr) minmax(220px,1fr);background:radial-gradient(ellipse at 8% 2%,#c9e4edaa,transparent 48%),radial-gradient(ellipse at 100% 30%,#e0edf3aa,transparent 50%),radial-gradient(ellipse at 95% 100%,#d5e6cdaa,transparent 45%),#fafcf8;box-shadow:inset 0 0 38px #d8e7e847;border:1px solid #e6eef0;padding:38px 28px 44px}
.garden-page .poem-copy{position:relative;z-index:1}.garden-page .poem-page-art{margin-top:70px}.garden-page .poem-page-art>.poem-illustration{max-height:620px}.garden-page .poem-lines{line-height:1.65}.garden-page:before{content:"";position:absolute;inset:12px 14px auto;height:40px;pointer-events:none;border-radius:50%;background:radial-gradient(ellipse at 10% 15%,#ffffffaa 0 14%,transparent 22%),radial-gradient(ellipse at 90% 10%,#ffffffbb 0 15%,transparent 24%);filter:blur(4px);z-index:-1}
@media(max-width:650px){.poem-reading{padding:22px 8px}.poem-reading.garden-page{padding:28px 12px 36px;border-radius:22px}.garden-page .poem-lines{font-size:19px;line-height:1.7}.garden-page .poem-page-art{display:block;position:static;width:150px;float:right;margin:8px -4px 6px 8px}.garden-page .poem-page-art>.poem-illustration{max-height:230px}.garden-page .poem-copy{display:contents}.garden-page .poem-lines{position:relative;clear:both}.garden-page .poem-page-art{float:none;position:absolute;right:0;bottom:4px;width:72px;opacity:.9;pointer-events:none}.garden-page{padding-bottom:115px!important}}

.poem-bubble-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:15;contain:strict}
.poem-falling-bubble{position:absolute;top:-90px;left:var(--bubble-x);width:var(--bubble-size);height:var(--bubble-size);border:1px solid #90c4df70;border-radius:50%;background:radial-gradient(circle at 28% 25%,#fff9 0 6%,#fff0 14%),radial-gradient(circle at 68% 75%,#e8c9ef40,#b7e5ed18 48%,#a8d9ef38 76%,#fff4);box-shadow:inset 2px 2px 5px #ffffff90,inset -2px -3px 6px #b8cce930;animation:poemBubbleFall var(--bubble-time) linear var(--bubble-delay) infinite;will-change:transform;opacity:.65}
@keyframes poemBubbleFall{0%{transform:translate3d(0,-10px,0);opacity:0}8%{opacity:.65}45%{transform:translate3d(var(--bubble-drift),48vh,0)}90%{opacity:.55}100%{transform:translate3d(0,calc(100vh + 180px),0);opacity:0}}
@media(prefers-reduced-motion:reduce){.poem-bubble-layer{display:none}}

.poem-snow-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:15;contain:strict}
.poem-snowflake{position:absolute;top:-110px;left:var(--snow-x);width:var(--snow-size);height:var(--snow-size);animation:poemSnowFall var(--snow-time) linear var(--snow-delay) infinite;will-change:transform}
.poem-snowflake svg{display:block;width:100%;height:100%;overflow:visible;animation:poemSnowSparkle var(--sparkle-time) ease-in-out var(--snow-delay) infinite}
@keyframes poemSnowFall{0%{transform:translate3d(0,-15px,0) rotate(0deg)}50%{transform:translate3d(var(--snow-drift),50vh,0) rotate(70deg)}100%{transform:translate3d(0,calc(100vh + 230px),0) rotate(160deg)}}
@keyframes poemSnowSparkle{0%,100%{opacity:.28;filter:drop-shadow(0 0 1px #c9d7f0)}45%{opacity:.65;filter:drop-shadow(0 0 3px #d1ddfb)}55%{opacity:.9;filter:drop-shadow(0 0 7px #c5d8ff)}65%{opacity:.5;filter:drop-shadow(0 0 2px #e8edff)}}
@media(prefers-reduced-motion:reduce){.poem-snow-layer{display:none}}

.poem-falling-bubble.bubble-popped{visibility:hidden}
.bubble-splash{position:absolute;width:1px;height:1px;pointer-events:none}
.bubble-splash-ring{position:absolute;left:-20px;top:-20px;width:40px;height:40px;border:2px solid #9dcee4;border-radius:50%;animation:bubbleSplashRing .65s ease-out forwards}
.bubble-splash-drop{position:absolute;left:-4px;top:-6px;width:8px;height:12px;border-radius:60% 60% 55% 55%;background:radial-gradient(circle at 30% 22%,#fff,#b0dfed 58%,#9bc4e5);animation:bubbleSplashDrop .75s cubic-bezier(.15,.55,.4,1) forwards}
@keyframes bubbleSplashRing{from{transform:scale(.35);opacity:.85}to{transform:scale(2.2);opacity:0}}
@keyframes bubbleSplashDrop{from{transform:translate(0,0) scale(1);opacity:.95}to{transform:translate(var(--drop-x),var(--drop-y)) rotate(var(--drop-turn)) scale(.25);opacity:0}}
@media(prefers-reduced-motion:reduce){.bubble-splash{display:none}}

.poem-reading .poem-copy>.poem-author{display:block;font-family:BookHandwriting,'Trebuchet MS',sans-serif;font-weight:400;font-size:clamp(23px,2.4vw,29px);line-height:1.6;color:#0878ad;margin:30px 0 8px;text-align:center;position:relative;z-index:1}
@media(max-width:650px){.poem-reading .poem-copy>.poem-author{font-size:24px;margin:26px 0 12px}}
.story-custom-illustration{display:block;width:100%;height:100%;max-height:360px;object-fit:contain}.storyscene:has(.story-custom-illustration){height:clamp(220px,32vw,360px)}

.badge-icon{display:flex;align-items:center;justify-content:center;height:116px;margin:0 auto 14px}.badge-watercolor{display:block;width:116px;height:116px;object-fit:contain}.badge-wrap>.badge{min-height:310px}.badge.locked .badge-icon{opacity:.68}.badge-popup-icon{width:76px;height:76px;background:transparent;border-radius:0}.badge-popup-icon .badge-watercolor{width:76px;height:76px}.badge-popup-head h2{overflow-wrap:anywhere}
@media(max-width:650px){.badge-icon{height:96px}.badge-watercolor{width:96px;height:96px}.badge-wrap>.badge{min-height:285px}.badge-popup-icon,.badge-popup-icon .badge-watercolor{width:60px;height:60px}}

са ручком . Т празно место Ш празно место А": [491.526, 497.576], "Њима говоримо и једемо . 4 слова": [498.006, 502.928], "Расте на глави . 4 слова": [503.358, 507.8], "Прави се од млека . 3 слова": [508.23, 512.6], "На које слово подсећају укрштене маказе?": [513.03, 516.992], "На које слово подсећа гитара са вратом у средини?": [517.422, 521.792], "На које слово те подсећају две наслагане књиге?": [522.222, 526.568], "На које слово подсећају три дрвета?": [526.998, 530.744], "На које писано слово подсећа ова переца?": [531.174, 535.28], "На које слово подсећају шиљате уши мачке?": [535.71, 539.936], "Обој пет зечића плаво, једног зелено и једног жуто. Преостали зечић остаје необојен.": [540.366, 548.84], "Кликни прво слово речи, па њено последње слово. Реч може ићи водоравно, усправно или укосо, у оба смера.": [549.27, 559.472], "Вук је позвао овцу у стари дол, претварајући се да жели да јој каже важне ствари. Овца је употребила свој ум: уместо да оде, послала је ловца.": [559.902, 572.048], "Ко је позвао овцу?": [572.478, 575.144], "Где је вук позвао овцу?": [575.574, 578.648], "Зашто је вук позвао овцу?": [579.078, 582.224], "Шта је користила овца?": [582.654, 585.728], "Кога је овца послала?": [586.158, 588.968], "Шта је вук планирао док се правио невешт?": [589.398, 593.264], "Крећи се суседним пољима и састави реченицу: Ја тражим страшног змаја.": [593.694, 600.104], "За воћни јогурт потребни су банана, поморанџа, јогурт и мед. Кликни кораке правилним редом.": [600.534, 609.776], "Кутија 1 / 3. Кликни слова да направиш речи са списка. Свако слово у речи користи највише једном.": [610.206, 620.96], "Кутија 2 / 3. Кликни слова да направиш речи са списка. Свако слово у речи користи највише једном.": [621.39, 632.072], "Кутија 3 / 3. Кликни слова да направиш речи са списка. Свако слово у речи користи највише једном.": [632.502, 643.136], "Како се чује аутомобил?": [643.566, 646.664], "Како звони телефон?": [647.094, 649.928], "Како се чује звоно?": [650.358, 653. <script id="audio-library" type="application/json">{"авион": "voice-00.mp3", "игла": "voice-01.mp3", "мачка": "voice-02.mp3", "торта": "voice-03.mp3", "око": "voice-04.mp3", "нос": "voice-05.mp3", "сунце": "voice-06.mp3", "ексер": "voice-07.mp3", "јабука": "voice-08.mp3", "риба": "voice-09.mp3", "уво": "voice-10.mp3", "шал": "voice-11.mp3", "лав": "voice-12.mp3", "љубичица": "voice-13.mp3", "голуб": "voice-14.mp3", "писмо": "voice-15.mp3", "зец": "voice-16.mp3", "веверица": "voice-17.mp3", "коњ": "voice-18.mp3", "дрво": "voice-19.mp3", "балон": "voice-20.mp3", "чаша": "voice-21.mp3", "ћуран": "voice-22.mp3", "хлеб": "voice-23.mp3", "жаба": "voice-24.mp3", "фока": "voice-25.mp3", "ципела": "voice-26.mp3", "њушка": "voice-27.mp3", "ђак": "voice-28.mp3", "џемпер": "voice-29.mp3", "Деда вуче репу, али репа остаје у земљи. Бака долази да помогне. Стижу дете и мала животиња. Сви заједно извуку репу!": "voice-30.mp3", "Медвед, мачка и зец иду на излет. У торби носе колаче. На ливади седну да се одморе и играју се преношења поруке.": "voice-31.mp3", "Почиње киша. Девојчица отвори кишобран. На стази угледа мале мраве. Она их склони од кише и насмеши се.": "voice-32.mp3", "Патка плива преко реке. На глави пажљиво носи писмо. У писму је лепа порука за њеног друга.": "voice-33.mp3", "Мачка има маче. Пас има штене. Крава има теле. Бебе расту, играју се и уче уз своје маме.": "voice-34.mp3", "Понедељак први, уторак други,\nсреда се смеје, четвртак љуби.\nПетак доноси радост свима,\nсубота, недеља – одмора има!": "poem-2-poem-sophie.mp3", "Који ти је омиљени дан у недељи?": "poem-2-question-sophie.mp3", "Јесен шушка, лишће пада,\nзлатна боја свуда влада.\nСвако доба радост даје,\nпогоди које сада траје!": "poem-3-poem-sophie.mp3", "Које годишње доба доноси шарено лишће?": "poem-3-question-sophie.mp3", "Погоди које је годишње доба?": "poem-1-question-sophie.mp3", "Пролеће цвета, лето нас греје,\nјесен шушка, зима веје.\nСвако доба радост носи,\nпогоди које сада се поноси!": "poem-1-poem-sophie-v2.mp3", "Сунце сија, звезда сјајна,\nгреје поља, наша бајна.\n\nКад јутро сване, Сунце се смеје,\nзлатним зрацима земљу греје.\nБез њега нема топлог дана,\nСунце је звезда – то зна свака мама!": "poem-4-poem-sophie.mp3", "Да ли је Сунце планета или звезда?": "poem-4-question-sophie.mp3", "Ала је леп овај свет,\nонде поток, овде цвет,\nтамо њива, овде сад,\nено Сунце, ево хлад!\n\nТамо Дунав, злата пун,\nонде трава, овде жбун,\nславуј песмом љуља луг.\nЈа га слушам и мој друг.": "poem-5-poem-sophie.mp3", "Ко у песми пева?": "poem-5-question-sophie.mp3", "Зима, зима, - е, па шта је?\nАко ј' зима, није лав!\nЗима, зима, - па нека је,\nне боји се ко је здрав!\n\nХајд' напоље момак ко је,\nтамо веје крупан снег,\nвидиш онде навејо је\nчитав бедем, читав брег.\n\nА шта може зима мени,\nшта ми може, шта ми сме?!\nНек ми носић поцрвени,\nето то је, то је све.\n\nСека Зорка, немој стати,\nтвој нек буде први ред;\nсад ћемо се загрејати, -\nчучни само на тај лед!\n\nГле сад живе железнице, -\nто је трка, то је лет.\nЗбогом, птице крилатице,\nнаш је сада цео свет!": "poem-6-poem-sophie.mp3", "Шта веје у песми?": "poem-6-question-sophie.mp3", "Ала је то дивота,\nкад се ко окупа!\n- што се не би купали,\nвода није скупа.\n\nМорамо се купати,\nпрљавштину стрести,\n- нечистоћа навлачи\nрђу и болести.\n\nЗато ј' мајка спремила\nводу, али млаку,\nзато је окупала\nсвога малог Лаку.\n\nА сад вели: \"Цицу ми\nпуштати не смете,\nјер ће мислит' да је сир,\nпојешће ми дете!\"\n\nКуцову је слободно,\nнек се заиграва,\nон ће Лаку чувати\nкад легне да спава.\n\nА старији, Андрија,\nон се већем свуко,\nшто га већ не купају,\nчисто би се туко.\n\nЧекај, чекај, Андрија,\nдок обришу Лаку,\nти ћеш онда добити\nдругу воду млаку.\n\nЛака ће с' у колевци\nтопити од сласти,\nа што буде сневао\nнеће ником касти.": "poem-7-poem-sophie.mp3", "Каква је вода коју је мајка спремила за купање?": "poem-7-question-sophie.mp3", "ДЕТЕ\nЛептирићу, шаренчићу,\nходи к мени амо!\nЕво имам лепу ружу,\nомириши само.\n\nЛЕПТИР\nЈа бих дошо, ал' се бојим\nкакве игле клете.\nСтиснућеш ме, пробошћеш ме,\nп' онда збогом, свете!\n\nДЕТЕ\nНећу, лепко, нећу, лепко,\nживота ми мога.\nСамо хоћу да избројим\nкол'ко имаш нога.\n\nЛЕПТИР\nЕ, па то ти могу казат'\nи издаље малко:\nлептир има шест ножица.\n– А сад збогом, ранко!": "poem-8-poem-sophie.mp3", "Колико ножица има лептир?": "poem-8-question-sophie.mp3", "Куд погледаш\nСвуда\nЧуда.\nОва киша\nБаш је луда,\nШто баш сада\nТако пада\nКад Јованка,\nБаштованка,\nРаденица\nВредна, жива,\nВрт залива.\n\nПадај, кишо,\nГоре с неба,\nПадај онда\nКада треба:\nКад Јованка,\nБаштованка,\nСвоје лене\nДане слави,\nПак по целу\nНедељицу\nВрт залити\nЗаборави.": "poem-9-poem-sophie.mp3", "Шта Јованка залива?": "poem-9-question-sophie.mp3", "Који има добра друга,\nне боји се очајања\nподељена туга\nупола је мања;\nподељена срећа\nдва пута је већа.": "poem-10-poem-sophie.mp3", "Каква је срећа када је поделимо са другом?": "poem-10-question-sophie.mp3", "Седи жаба сама\nна листу локвања,\nод жаркога сунца\nштитом се заклања.\n\nДа новине чита,\nто вам слика каже,\nал не мож да нађе\nшто јој очи траже.\n\nЗнате већ о чему\nжабе бригу воде:\nхоће ли се скоро\nодселити роде.": "poem-11-poem-sophie.mp3", "Шта жаба жели да сазна из новина?": "poem-11-question-sophie.mp3", "Где год нађеш згодно место,\nту дрво посади!\nА дрво је благородно\nпа ће да награди.\n\nНаградиће изобиљем\nхлада, плода свог,\nнаградиће било тебе,\nбило брата твог.": "poem-12-poem-sophie.mp3", "Чиме ће дрво да нас награди?": "poem-12-question-sophie.mp3", "Ево, драга дечице,\nвоћа свакојака:\nгрожђа црна, грожђа бела,\nјабука, крушака!\n\nОве лепе дарове\nјесен нам је дала,\nдрага наша јесени,\nвелика ти хвала!\n\nТо је само на слици,\nпа нам мира не да;\nоно воће, право воће,\nјош лепше изгледа.\n\nОве лепе дарове\nјесен нам је дала,\nдрага наша јесени,\nвелика ти хвала!\n\nСетимо се пролећа,\nњегових цветова;\nшто нам цвеће обећало,\nево тих дарова!\n\nОве лепе дарове\nјесен нам је дала,\nдрага наша јесени,\nвелика ти хвала!\n\nСад имамо до воље\nвоћа свакојака:\nгрожђа црна, грожђа бела,\nјабука, крушака!\n\nОве лепе дарове\nјесен нам је дала,\nдрага наша јесени,\nвелика ти хвала!": "poem-13-poem-sophie.mp3", "Које воће се помиње у песми?": "poem-13-question-sophie.mp3", "Јесте л’ чули, кумо,\nверујте, без шале,\nотвара се школа\nза пачиће мале.\n\nТако је и било,\nверујте, без шале,\nотворила с школа\nза пачиће мале.\n\nСви пачићи дошли,\nна скамијам стоје\nстари патак метно\nнаочари своје.\n\nСве их је уписо\nу каталог, мале,\nпа их је прозиво,\nверујте, без шале.\n\nПа се онда шето\nс озбиљношћу крутом\nучио их, учио,\nи књигом и прутом.\n\nУчио их, учио\nод среде до петка,\nал’ се нису одмакли\nдаље од почетка.\n\nНије било успеха\nучитељском труду,\nцела мука његова\nостаде залуду.\n\nНишта више не научи\nпачурлија та,\nнего што је и пре знала\nГа, га, га, га, га!": "poem-14-poem-sophie.mp3", "Шта су пачићи знали да кажу на крају песме?": "poem-14-question-sophie.mp3", "Такмичили се Ветар и Сунце ко је јачи: Ветар је снажно дувао, али је путник само јаче стезао свој појас. Када га је Сунце огрејало, путник је сам скинуо огртач, показујући да доброта и топлина побеђују силу.": "story-6-poem-sophie.mp3", "Шта је навело путника да скине огртач?": "story-6-question-sophie.mp3"}</script>

let alternate=false;player.onerror=()=>{if(!alternate&&speechClips[text]){alternate=true;player.src=speechClips[text];player.load();readerStatus('Додирни дугме за слушање поново.')}else readerStatus('Снимак није доступан у овом приказу. Сачувај HTML и отвори га у Chrome или Edge.')};player.onplay=()=>{if(activePlayer&&activePlayer!==player)activePlayer.pause();activePlayer=player;if(!state.sound){state.sound=true;save()}player.muted=false;player.volume=1};player.onplaying=()=>{trigger.textContent='↺ Послушај поново'};player.onended=()=>{trigger.textContent='↺ Послушај поново'};trigger.onclick=()=>say(text);return player}
function playBuiltIn(text){let player=currentReader;if(!player||player.dataset.clipText!==text){const trigger=$('#listen')||$('#testVoice');if(trigger)player=bindReader(text,'#'+trigger.id)}if(!player){readerStatus('Отвори слово или причу и притисни дугме за слушање.');return}activePlayer=player;player.muted=false;player.volume=1;try{player.currentTime=0}catch(e){}let result;try{result=player.play()}catch(e){readerStatus('Притисни дугме за слушање поново.');return}if(result?.catch)result.catch(e=>{if(e.name==='AbortError')return;readerStatus(e.name==='NotAllowedError'?'Притисни дугме за слушање поново. Ако овај приказ блокира звук, преузми HTML и отвори га у Chrome или Edge.':'Снимак се није покренуо. Покушај поново или отвори преузети HTML у Chrome или Edge.')})}

function say(text){stopAudio();state.sound=true;save();unlockAudio();playBuiltIn(text)}

function celebrate(){let d=document.createElement('div');d.className='confetti';for(let i=0;i<28;i++){let c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.background=['#eac053','#7761af','#68a684','#ef9a79'][i%4];c.style.animationDelay=Math.random()*.3+'s';d.append(c)}document.body.append(d);setTimeout(()=>d.remove(),2100)}

function alphabeticalLetters(list){return alphabet.map(letter=>list.find(item=>item[0]===letter)).filter(Boolean)}
function adjacentLetterIndex(list,index,step){const position=alphabet.indexOf(list[index][0]);return list.findIndex(item=>item[0]===alphabet[(position+step+alphabet.length)%alphabet.length])}
function letterButtons(arr){return '<div class="gridletters">'+arr.map(l=>{let i=letters.indexOf(l),n=state.earned.filter(x=>x.startsWith('l'+i+'-')).length;return '<button class="letter '+(n>=5?'done':'')+'" data-letter="'+i+'" aria-label="Слово '+l[0]+', '+l[1]+'">'+l[0]+'<small>'+n+'/5</small></button>'}).join('')+'</div>'}

if(mode==='learn'){w.innerHTML='<div class="lesson-layout"><div><div class="eyebrow">УПОЗНАЈ НОВОГ ДРУГАРА</div><div class="bigletter">'+l[0]+lower+'</div><h2>'+l[1].toUpperCase()+'</h2><button class="small" id="listen">♫ Послушај реч</button></div><div>'+letterIllustration(l[2])+'<p>Пронађи слово <strong>'+l[0]+'</strong>.</p></div></div><div class="choices">'+options(l[0],alphabet).map(v=>'<button class="choice" data-answer="'+v+'">'+v+'</button>').join('')+'</div>'+end;bindReader(l[1]);answers(l[0]);}
if(mode==='initial'){w.innerHTML='<h2>Којим словом почиње ова реч?</h2>'+letterIllustration(l[2])+'<h3>'+l[1].toUpperCase()+'</h3><div class="choices">'+options(l[0],alphabet).map(v=>'<button class="choice" data-answer="'+v+'">'+v+'</button>').join('')+'</div>'+end;answers(l[0])}
if(mode==='case'){w.innerHTML='<h2>Пронађи мало слово.</h2>'+letterIllustration(l[2])+'<div class="bigletter">'+l[0]+'</div><p>Које мало слово је пар овом великом слову?</p><div class="choices">'+options(lower,alphabet.map(x=>x.toLowerCase())).map(v=>'<button class="choice" data-answer="'+v+'">'+v+'</button>').join('')+'</div>'+end;answers(lower)}
if(mode==='build'){let chars=l[1].toUpperCase().split(''),picked=[];w.innerHTML='<h2>Сложи реч од слова.</h2>'+letterIllustration(l[2])+'<p>Модел: <strong>'+l[1].toUpperCase()+'</strong></p><div class="slots" id="slots">'+chars.map(()=>'·').join('')+'</div><div class="tiles">'+shuffle(chars.map((c,i)=>({c,i}))).map(x=>'<button class="tile" data-tile="'+x.i+'">'+x.c+'</button>').join('')+'</div><div class="controls"><button class="secondary" id="undo">← Врати слово</button> <button class="primary" id="check">Провери</button></div>'+end;let update=()=>{$('#slots').textContent=picked.map(x=>chars[x]).join('')+'·'.repeat(chars.length-picked.length)};document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{if(locked)return;picked.push(+b.dataset.tile);b.disabled=true;update()});$('#undo').onclick=()=>{if(locked)return;let n=picked.pop();if(n!==undefined)$('[data-tile="'+n+'"]').disabled=false;update();feedback('')};$('#check').onclick=()=>{if(locked)return;if(picked.map(x=>chars[x]).join('')===l[1].toUpperCase())success();else feedback('Погледај модел и покушај поново. Можеш да вратиш слово.')}}

function answers(correct){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(locked)return;if(b.dataset.answer===correct){b.classList.add('good');success()}else{b.classList.add('bad');b.disabled=true;feedback('Добар покушај! Погледај још једном.')}})}
function success(text='Браво! Освојио си звездицу.'){locked=true;let id='l'+current+'-'+mode;let old=state.earned.includes(id);award(id);feedback(old?'Браво! Поновио си ову вежбу.':text);let b=document.createElement('button');b.className='primary';b.textContent=mode==='trace'?'Следеће слово →':'Следећи задатак →';b.onclick=()=>{let n=modes.findIndex(x=>x[0]===mode);lesson(mode==='trace'?adjacentLetterIndex(letters,current,1):current,mode==='trace'?'learn':modes[n+1][0])};if(wordGameContext){const {i,script}=wordGameContext;b.textContent='Следећа реч →';b.onclick=()=>wordGame(adjacentLetterIndex(letters,i,1),script)}$('#work').append(b)}
function setupCanvas(text=''){let c=$('#drawing'),ctx=c.getContext('2d'),down=false,drawn=false;function reset(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fffdf5';ctx.fillRect(0,0,c.width,c.height);if(text){ctx.strokeStyle='#dce3d5';ctx.lineWidth=2;[75,255].forEach(y=>{ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(870,y);ctx.stroke()});ctx.font='bold 240px Arial';ctx.textAlign='center';ctx.fillStyle='#d9dfd1';ctx.fillText(text,450,252)}drawn=false}reset();function pos(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);let [x,y]=pos(e);ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=ink;ctx.fill();ctx.beginPath();ctx.moveTo(x,y);drawn=true};c.onpointermove=e=>{if(!down)return;ctx.lineWidth=9;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ink;ctx.lineTo(...pos(e));ctx.stroke()};c.onpointerup=c.onpointercancel=()=>down=false;return{reset,hasDrawn:()=>drawn}}

const storyData=[{name:'Деда и репа',ref:'стр. 24–25',kind:'tree',text:'Деда вуче репу, али репа остаје у земљи. Бака долази да помогне. Стижу дете и мала животиња. Сви заједно извуку репу!',q:'Како су извукли репу?',a:['Заједно су помогли.','Репа је одлетела.','Нико није помогао.'],correct:0,talk:'Када си ти некоме помогао?'},{name:'На излету',ref:'стр. 30–31',kind:'rabbit',text:'Медвед, мачка и зец иду на излет. У торби носе колаче. На ливади седну да се одморе и играју се преношења поруке.',q:'Шта су понели у торби?',a:['Колаче.','Ципеле.','Кишобран.'],correct:0,talk:'Шта би ти понео на излет? Смисли смешну поруку.'},{name:'Кишобран',ref:'стр. 36',kind:'flower',text:'Почиње киша. Девојчица отвори кишобран. На стази угледа мале мраве. Она их склони од кише и насмеши се.',q:'Зашто је отворила кишобран?',a:['Падала је киша.','Падао је снег.','Да направи торту.'],correct:0,talk:'Нацртај како би ти помогао малој животињи.'},{name:'Паткино писмо',ref:'стр. 40',kind:'fish',text:'Патка плива преко реке. На глави пажљиво носи писмо. У писму је лепа порука за њеног друга.',q:'Где се налази писмо?',a:['На глави патке.','Под каменом.','На дрвету.'],correct:0,talk:'Коме би ти послао лепу поруку?'},{name:'Маме и бебе',ref:'стр. 53',kind:'cat',text:'Мачка има маче. Пас има штене. Крава има теле. Бебе расту, играју се и уче уз своје маме.',q:'Како се зове беба мачке?',a:['Маче.','Теле.','Штене.'],correct:0,talk:'Које још животињске породице познајеш?'},{"name": "Ветар и Сунце", "kind": "wind-sun", "text": "Такмичили се Ветар и Сунце ко је јачи: Ветар је снажно дувао, али је путник само јаче стезао свој појас. Када га је Сунце огрејало, путник је сам скинуо огртач, показујући да доброта и топлина побеђују силу.", "q": "Шта је навело путника да скине огртач?", "a": ["Сунчева топлина.", "Јак ветар.", "Хладна киша."], "correct": 0, "talk": "Како можеш добротом да помогнеш некоме? Испричај када су ти лепе речи или пажња улепшале дан.", "art": "story-6-wind-sun.svg"}];
const poemData=[{"title": "Годишња доба", "text": "Пролеће цвета, лето нас греје,\nјесен шушка, зима веје.\nСвако доба радост носи,\nпогоди које сада се поноси!", "question": "Погоди које је годишње доба?", "answers": ["Пролеће", "Лето", "Јесен", "Зима"], "correct": 2}, {"title": "Дани у недељи", "text": "Понедељак први, уторак други,\nсреда се смеје, четвртак љуби.\nПетак доноси радост свима,\nсубота, недеља – одмора има!", "question": "Који ти је омиљени дан у недељи?", "answers": ["Понедељак", "Уторак", "Среда", "Четвртак", "Петак", "Субота", "Недеља"]}, {"title": "Песма о јесени", "text": "Јесен шушка, лишће пада,\nзлатна боја свуда влада.\nСвако доба радост даје,\nпогоди које сада траје!", "question": "Које годишње доба доноси шарено лишће?", "answers": ["Пролеће", "Лето", "Јесен", "Зима"], "correct": 2}, {"title": "Сунце", "text": "Сунце сија, звезда сјајна,\nгреје поља, наша бајна.\n\nКад јутро сване, Сунце се смеје,\nзлатним зрацима земљу греје.\nБез њега нема топлог дана,\nСунце је звезда – то зна свака мама!", "question": "Да ли је Сунце планета или звезда?", "answers": ["Планета", "Звезда"], "correct": 1, "success": "Браво! Сунце је звезда. ☀", "talk": "Разговарајте: шта примећујете када Сунце изађе?"}, {"title": "Ала је леп овај свет", "author": "Јован Јовановић Змај", "text": "Ала је леп овај свет,\nонде поток, овде цвет,\nтамо њива, овде сад,\nено Сунце, ево хлад!\n\nТамо Дунав, злата пун,\nонде трава, овде жбун,\nславуј песмом љуља луг.\nЈа га слушам и мој друг.", "question": "Ко у песми пева?", "answers": ["Славуј", "Зец", "Мачка"], "correct": 0, "success": "Браво! У песми пева славуј.", "talk": "Разговарајте: које лепе ствари видите око себе?"}, {"title": "Зимска песма", "author": "Јован Јовановић Змај", "text": "Зима, зима, - е, па шта је?\nАко ј' зима, није лав!\nЗима, зима, - па нека је,\nне боји се ко је здрав!\n\nХајд' напоље момак ко је,\nтамо веје крупан снег,\nвидиш онде навејо је\nчитав бедем, читав брег.\n\nА шта може зима мени,\nшта ми може, шта ми сме?!\nНек ми носић поцрвени,\nето то је, то је све.\n\nСека Зорка, немој стати,\nтвој нек буде први ред;\nсад ћемо се загрејати, -\nчучни само на тај лед!\n\nГле сад живе железнице, -\nто је трка, то је лет.\nЗбогом, птице крилатице,\nнаш је сада цео свет!", "question": "Шта веје у песми?", "answers": ["Крупан снег", "Киша", "Лишће"], "correct": 0, "success": "Браво! У песми веје крупан снег.", "talk": "Разговарајте: које зимске игре волите?"}, {"title": "Купање", "author": "Јован Јовановић Змај", "text": "Ала је то дивота,\nкад се ко окупа!\n- што се не би купали,\nвода није скупа.\n\nМорамо се купати,\nпрљавштину стрести,\n- нечистоћа навлачи\nрђу и болести.\n\nЗато ј' мајка спремила\nводу, али млаку,\nзато је окупала\nсвога малог Лаку.\n\nА сад вели: \"Цицу ми\nпуштати не смете,\nјер ће мислит' да је сир,\nпојешће ми дете!\"\n\nКуцову је слободно,\nнек се заиграва,\nон ће Лаку чувати\nкад легне да спава.\n\nА старији, Андрија,\nон се већем свуко,\nшто га већ не купају,\nчисто би се туко.\n\nЧекај, чекај, Андрија,\nдок обришу Лаку,\nти ћеш онда добити\nдругу воду млаку.\n\nЛака ће с' у колевци\nтопити од сласти,\nа што буде сневао\nнеће ником касти.", "question": "Каква је вода коју је мајка спремила за купање?", "answers": ["Млака", "Врела", "Ледена"], "correct": 0, "success": "Тачно! Мајка је спремила млаку воду.", "talk": "Разговарај са родитељем или другом: како се бринемо о чистоћи и зашто нам прија купање?"}, {"title": "Дете и лептир", "author": "Јован Јовановић Змај", "text": "ДЕТЕ\nЛептирићу, шаренчићу,\nходи к мени амо!\nЕво имам лепу ружу,\nомириши само.\n\nЛЕПТИР\nЈа бих дошо, ал' се бојим\nкакве игле клете.\nСтиснућеш ме, пробошћеш ме,\nп' онда збогом, свете!\n\nДЕТЕ\nНећу, лепко, нећу, лепко,\nживота ми мога.\nСамо хоћу да избројим\nкол'ко имаш нога.\n\nЛЕПТИР\nЕ, па то ти могу казат'\nи издаље малко:\nлептир има шест ножица.\n– А сад збогом, ранко!", "dialogue": true, "question": "Колико ножица има лептир?", "answers": ["Шест", "Четири", nА дрво је благородно\nпа ће да награди.\n\nНаградиће изобиљем\nхлада, плода свог,\nнаградиће било тебе,\nбило брата твог.", "question": "Чиме ће дрво да нас награди?", "answers": ["Хладом и плодовима", "Играчкама", "Новинама"], "correct": 0, "success": "Браво! Дрво нас награђује хладом и плодовима.", "talk": "Разговарај са родитељем или другом: где бисте могли да посадите дрво? Како бисте бринули о њему док расте?"}, {"title": "Хвала", "author": "Јован Јовановић Змај", "text": "Ево, драга дечице,\nвоћа свакојака:\nгрожђа црна, грожђа бела,\nјабука, крушака!\n\nОве лепе дарове\nјесен нам је дала,\nдрага наша јесени,\nвелика ти хвала!\n\nТо је само на слици,\nпа нам мира не да;\nоно воће, право воће,\nјош лепше изгледа.\n\nОве лепе дарове\nјесен нам је дала,\nдрага наша јесени,\nвелика ти хвала!\n\nСетимо се пролећа,\nњегових цветова;\nшто нам цвеће обећало,\nево тих дарова!\n\nОве лепе дарове\nјесен нам је дала,\nдрага наша јесени,\nвелика ти хвала!\n\nСад имамо до воље\nвоћа свакојака:\nгрожђа црна, грожђа бела,\nјабука, крушака!\n\nОве лепе дарове\nјесен нам је дала,\nдрага наша јесени,\nвелика ти хвала!", "question": "Које воће се помиње у песми?", "answers": ["Грожђе, јабуке и крушке", "Банане и ананас", "Лимун и поморанџе"], "correct": 0, "success": "Браво! У песми се помињу грожђе, јабуке и крушке.", "talk": "Разговарај са родитељем или другом: које јесење воће највише волиш? Коме би ти данас рекао хвала и зашто?"}, {"title": "Пачија школа", "author": "Јован Јовановић Змај", "text": "Јесте л’ чули, кумо,\nверујте, без шале,\nотвара се школа\nза пачиће мале.\n\nТако је и било,\nверујте, без шале,\nотворила с школа\nза пачиће мале.\n\nСви пачићи дошли,\nна скамијам стоје\nстари патак метно\nнаочари своје.\n\nСве их је уписо\nу каталог, мале,\nпа их је прозиво,\nверујте, без шале.\n\nПа се онда шето\nс озбиљношћу крутом\nучио их, учио,\nи књигом и прутом.\n\nУчио их, учио\nод среде до петка,\nал’ се нису одмакли\nдаље од почетка.\n\nНије било успеха\nучитељском труду,\nцела мука његова\nостаде залуду.\n\nНишта више не научи\nпачурлија та,\nнего што је и пре знала\nГа, га, га, га, га!", "question": "Шта су пачићи знали да кажу на крају песме?", "answers": ["Га, га, га!", "Мјау, мјау!", "Ав, ав!"], "correct": 0, "success": "Браво! Пачићи су и даље говорили: га, га, га!", "talk": "Разговарај са родитељем или другом: шта ти је смешно у овој песми? Како би ти осмислио занимљив час за пачиће?"}];

function popBathBubble(bubble,layer){if(bubble.classList.contains('bubble-popped'))return;const r=bubble.getBoundingClientRect(),burst=document.createElement('span');burst.className='bubble-splash';burst.style.left=(r.left+r.width/2)+'px';burst.style.top=(r.top+r.height/2)+'px';burst.innerHTML='<span class="bubble-splash-ring"></span>'+Array.from({length:12},(_,n)=>{const angle=n*Math.PI/6,distance=38+n%3*13;return '<span class="bubble-splash-drop" style="--drop-x:'+(Math.cos(angle)*distance).toFixed(1)+'px;--drop-y:'+(Math.sin(angle)*distance+18).toFixed(1)+'px;--drop-turn:'+(n*30)+'deg"></span>'}).join('');layer.append(burst);bubble.classList.add('bubble-popped');burst.addEventListener('animationend',e=>{if(e.target.classList.contains('bubble-splash-drop'))burst.remove()},{once:true});setTimeout(()=>{burst.remove();if(bubble.isConnected)bubble.classList.remove('bubble-popped')},900)}
document.addEventListener('click',e=>{const layer=document.querySelector('.poem-bubble-layer');if(!layer||e.target.closest('button,a,input,select,textarea,[role="button"],.nav'))return;for(const bubble of layer.querySelectorAll('.poem-falling-bubble:not(.bubble-popped)')){const r=bubble.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(x*x+y*y<=Math.pow(r.width/2+5,2)){popBathBubble(bubble,layer);break}}});

function poem(i){stopAudio();const p=poemData[i],spokenQuestion=(p.clue?p.clue+' ':'')+p.question;app.innerHTML='<div class="sectionhead poem-sectionhead"><button class="small" id="backPoems">← Песмице</button><h2>'+p.title+'</h2><span class="poem-mobile-art" aria-hidden="true">'+poemArt(i)+'</span></div><div class="workspace poem-workspace">'+poemReading(p,i)+(p.clue?'<p class="poem-clue">'+p.clue+'</p>':'')+'<h2>'+p.question+'</h2><button class="small" id="readPoemQuestion">♫ Прочитај питање</button><div class="choices poem-choices">'+p.answers.map((answer,j)=>'<button class="choice word" data-poem-answer="'+j+'" aria-pressed="false">'+answer+'</button>').join('')+'</div><div class="feedback" id="feedback" role="status"></div><p class="poem-conversation">'+(p.talk||(i!==1?'Разговарајте: шта волите да радите у свако годишње доба?':'Разговарајте: шта волиш да радиш тог дана?'))+'</p></div>'+(i===6?bathBubbles():i===5?winterSnow():'');$('#backPoems').onclick=()=>nav('poems');bindReader(p.text);$('#readPoemQuestion').onclick=()=>speakAssignment(spokenQuestion,$('#readPoemQuestion'));document.querySelectorAll('[data-poem-answer]').forEach(b=>b.onclick=()=>{const j=+b.dataset.poemAnswer;if(p.correct!==undefined&&j!==p.correct){b.classList.add('bad');$('#feedback').textContent='Послушај песмицу поново и покушај још једном!';return}document.querySelectorAll('[data-poem-answer]').forEach(x=>{x.classList.remove('good','bad');x.setAttribute('aria-pressed','false')});b.classList.add('good');b.setAttribute('aria-pressed','true');if(i===1){state.favouriteDay=p.answers[j];save()}award('poem'+i);$('#feedback').textContent=i!==1?(p.success||'Браво! То је јесен. 🍂'):'Твој омиљени дан је '+p.answers[j].toLowerCase()+'. Леп избор!';});if(i===1&&state.favouriteDay){const j=p.answers.indexOf(state.favouriteDay),b=document.querySelector('[data-poem-answer="'+j+'"]');if(b){b.classList.add('good');b.setAttribute('aria-pressed','true')}}}

function stories(){app.innerHTML='<div class="sectionhead"><h2>Мале приче, велике идеје</h2></div><p>Кратке приче за слушање и разговор. Читај са одраслим.</p><div class="cards">'+storyData.map((s,i)=>'<button class="card" data-story="'+i+'">'+(i===0?'<img decoding="async" loading="lazy" class="story-thumbnail" src="'+readAsset('#story-thumbnail')+'" alt="Деда, бака, дете и зец заједно вуку репу">':i===1?'<img decoding="async" loading="lazy" class="story-thumbnail" src="'+readAsset('#picnic-thumbnail')+'" alt="Медвед, мачка и зец на излету са корпом колача">':i===2?'<img decoding="async" loading="lazy" class="story-thumbnail" src="'+readAsset('#umbrella-thumbnail')+'" alt="Девојчица са кишобраном помаже малим мравима">':i===3?'<img decoding="async" loading="lazy" class="story-thumbnail" src="'+readAsset('#duck-thumbnail')+'" alt="Патка носи писмо на глави">':i===4?'<img decoding="async" loading="lazy" class="story-thumbnail" src="'+readAsset('#families-thumbnail')+'" alt="Мачка и маче, пас и штене, крава и теле">':s.art?'<img decoding="async" loading="lazy" class="story-thumbnail" src="'+s.art+'" alt="Ветар, Сунце и путник">':svg(s.kind))+'<h3>'+s.name+'</h3><p>Прочитај • одговори • испричај</p></button>').join('')+'</div>';document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>story(+b.dataset.story))}
function story(i){stopAudio();let s=storyData[i];locked=false;app.innerHTML='<div class="sectionhead"><button class="small" id="back">← Приче</button><h2>'+s.name+'</h2></div><div class="workspace">'+((i===0||i===1||i===2||i===3||i===4)?'<div class="storyscene storyvideo"><video id="storyVideo" playsinline preload="metadata" aria-label="Анимирана прича: '+s.name+'"></video></div><div class="video-actions"><button class="small" id="playStoryVideo" aria-pressed="false">▶ Пусти причу</button></div>':'<div class="storyscene">'+(s.art?'<img class="story-custom-illustration" src="'+s.art+'" alt="Ветар, Сунце и путник">':svg(s.kind))+'</div>')+'<div class="storytext">'+s.text+'</div><button class="small" id="listen">♫ Прочитај</button><h2>'+s.q+'</h2>'+(s.art?'<button class="small" id="readStoryQuestion">♫ Прочитај питање</button>':'')+'<div class="choices">'+shuffle(s.a.map((t,j)=>({t,j}))).map(x=>'<button class="choice word" data-story-answer="'+x.j+'">'+x.t+'</button>').join('')+'</div><div class="feedback" id="feedback" role="status"></div><p class="instructions"><strong>Сада ти причај:</strong> '+s.talk+'</p><button class="secondary" id="drawstory">Нацртај своју причу</button></div>';$('#back').onclick=()=>nav('stories');bindReader(s.text);if(s.art)$('#readStoryQuestion').onclick=()=>speakAssignment(s.q,$('#readStoryQuestion'));if(i===0||i===1||i===2||i===3||i===4)bindStoryVideo(i);$('#drawstory').onclick=()=>draw('Моја прича');document.querySelectorAll('[data-story-answer]').forEach(b=>b.onclick=()=>{if(locked)return;if(+b.dataset.storyAnswer===s.correct){locked=true;b.classList.add('good');let old=state.earned.includes('story'+i);award('story'+i);feedback(old?'Тачно! Лепо си поновио причу.':'Тачно! Нова звездица за тебе.')}else{b.classList.add('bad');b.disabled=true;feedback('Прочитај причу још једном. Покушај поново.')}})}

let beeSceneCleanup=null;
function startRandomBee(){
 if(beeSceneCleanup)beeSceneCleanup();
 const card=document.querySelector('[data-art="flower"]'),bee=card?.querySelector('.flying-bee');if(!bee)return;
 const origin=bee.getBoundingClientRect(),box=card.getBoundingClientRect();card.append(bee);bee.classList.add('roaming-bee');
 let x=origin.left-box.left,y=origin.top-box.top,flight,disposed=false;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const bounds=()=>({w:Math.max(12,card.clientWidth-bee.offsetWidth-12),h:Math.max(12,card.clientHeight-bee.offsetHeight-12)});
 function place(){const b=bounds();x=Math.max(12,Math.min(x,b.w));y=Math.max(12,Math.min(y,b.h));bee.style.transform='translate('+x+'px,'+y+'px)';}
 function fly(){if(disposed||!card.isConnected||document.hidden||reduced.matches)return;place();const b=bounds(),nx=12+Math.random()*(b.w-12),ny=12+Math.random()*(b.h-12),angle=nx>x?6:-6;flight=bee.animate([{transform:'translate('+x+'px,'+y+'px) rotate(0deg)'},{transform:'translate('+nx+'px,'+ny+'px) rotate('+angle+'deg)'}],{duration:2600+Math.random()*1600,easing:'ease-in-out',fill:'forwards'});flight.onfinish=()=>{x=nx;y=ny;flight.cancel();flight=null;place();fly()}}

function completedActivityLabel(id){const pm=id.match(/^poem(\d+)$/);if(pm&&poemData[+pm[1]])return 'Песмица „'+poemData[+pm[1]].title+'“ — '+(+pm[1]===1?'изабран омиљени дан':'тачан одговор');const cb=id.match(/^cb(\d+)$/);if(cb&&letters[+cb[1]])return 'Писана слова · Сложи реч — '+letters[+cb[1]][1];const ng=id.match(/^ng(\d+)$/);if(ng){const game=nativeGames.find(g=>g.id===+ng[1]);return game?'Писана слова · '+game.title+' — '+(game.type==='creative'?'рад прегледан':'решено'):null}const c=id.match(/^c(\d+)-recognize$/);if(c&&cursiveLetters[+c[1]])return 'Писано слово '+cursiveLetters[+c[1]][0]+' — препознавање';const q=id.match(/^cq(\d+)$/);if(q&&cursivePuzzles[+q[1]])return 'Писана слова · '+(+q[1]<6||+q[1]>=15?'загонетка':'ребус')+' '+(+q[1]+1)+' — '+cursivePuzzles[+q[1]].answers[0];const letter=id.match(/^l(\d+)-(learn|initial|case|build|trace)$/);if(letter){const l=letters[+letter[1]],m=modes.find(x=>x[0]===letter[2]);return l&&m?'Слово '+l[0]+' — '+l[1]+' · '+m[1].replace(/^\d+\. /,''):null}const storyMatch=id.match(/^story(\d+)$/);return storyMatch&&storyData[+storyMatch[1]]?'Прича „'+storyData[+storyMatch[1]].name+'“ — тачан одговор':null}

 const [count,icon,name]=badge,tasks=completed.slice(0,count),earned=completed.length>=count,fullLetters=letters.filter((l,i)=>modes.every(m=>tasks.some(x=>x.id==='l'+i+'-'+m[0]))).length,stories=tasks.filter(x=>x.id.startsWith('story')).length;
 const dialog=document.createElement('dialog');dialog.id='badgeProgressDialog';dialog.className='badge-popup';dialog.setAttribute('aria-labelledby','badgePopupTitle');dialog.setAttribute('aria-describedby','badgePopupSummary');

 document.body.append(dialog);const previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';const close=()=>dialog.close();dialog.querySelector('#closeBadgePopup').onclick=close;dialog.querySelector('#doneBadgePopup').onclick=close;dialog.addEventListener('click',e=>{const r=dialog.getBoundingClientRect();if(e.target===dialog&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))close()});dialog.addEventListener('close',()=>{document.body.style.overflow=previousOverflow;dialog.remove();if(opener.isConnected)opener.focus({preventScroll:true})},{once:true});dialog.showModal();
}

function parent(){app.classList.add('parent-page');app.innerHTML='<div class="sectionhead"><h2>За родитеље и наставнике</h2></div><div class="workspace" style="text-align:left"><h3>Мали кораци, без журбе</h3><p class="instructions">За узраст 3–4 године: бирајте слике, бојење и кратко слушање уз одраслог. За 5–6 година и прваке: додајте прво слово, парове великих и малих слова, слагање речи и писање. Узраст је смерница — пратите дететову спремност.</p><h3>Шта дете може да истражује?</h3><p class="muted">Ту су штампана и писана слова, загонетке, ребуси, укрштенице и друге игре, пет кратких прича и шест слика за бојење. Вежбајте заједно, без журбе. Слободно писање проверава одрасли.</p><h3>Рад без интернета</h3><p>У објављеној апликацији прво притисните „Преузми за рад без интернета“ у панелу изнад и сачекајте потврду. Игре, слике, анимације, гласови и видео-приче тада су доступни без везе. Пре пута искључите Wi‑Fi и мобилне податке и испробајте једну игру и причу.</p><h3>Слушање задатака</h3><p>Притисните „Прочитај“ испод задатка или „Послушај реч“. Проверите да пише „Звук: да“ и појачајте звук уређаја. Камера, микрофон и локација нису потребни.</p><h3>Напредак и цртежи</h3><p class="instructions">Звездице и бојење се чувају у овом прегледачу ако је локално чување дозвољено. Слободне цртеже преузмите као PNG. Брисање података прегледача може обрисати напредак. Исто успешно решено питање не доноси нову звездицу. Писање је слободна вежба без аутоматске процене.</p><p id="storagestatus">'+(storageOK?'Локално чување је доступно.':'Локално чување није доступно — напредак ће трајати само током ове сесије.')+'</p><button class="secondary" id="export">Преузми напредак</button> <button class="small" id="resetprogress">Обриши напредак…</button><div class="feedback" id="feedback"></div></div>';$('#export').onclick=()=>download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'bukvar-napredak.json');$('#resetprogress').onclick=()=>{if(confirm('Обрисати све звезд function cursivePairLayout(text,width=440,height=200){const ctx=document.createElement('canvas').getContext('2d');ctx.font='240px BookHandwriting';const m=ctx.measureText(text),left=m.actualBoundingBoxLeft||0,right=m.actualBoundingBoxRight||m.width,ascent=m.actualBoundingBoxAscent||170,descent=m.actualBoundingBoxDescent||0;const scale=Math.min(1,(width-32)/(left+right),(height-24)/(ascent+descent));return {size:240*scale,x:(width-(left+right)*scale)/2+left*scale,y:(height-(ascent+descent)*scale)/2+ascent*scale}}
function fitCursiveLetterModels(){document.querySelectorAll('.cursive-model text').forEach(text=>{const p=cursivePairLayout(text.textContent);text.setAttribute('font-size',p.size);text.setAttribute('x',p.x);text.setAttribute('y',p.y)})}

function cursiveActivityTabs(i,active){return '<div class="tabs">'+[['learn','1. Откриј'],['build','2. Сложи реч'],['trace','3. Пиши']].map(([id,label])=>'<button class="tab '+(id===active?'active':'')+'" data-cursive-activity="'+id+'">'+label+(id==='build'&&state.earned.includes('cb'+i)?' ✓':'')+'</button>').join('')+'</div>'}

function cursiveWord(i=0){stopAudio();let l=letters[i],chars=Array.from(l[1].toLowerCase()),picked=[],finished=false;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.nav==='cursive'));app.innerHTML='<div class="sectionhead"><button class="small" id="cbBack">← Писана слова</button><span class="muted">'+(alphabet.indexOf(l[0])+1)+' / 30 · '+l[1]+'</span><div><button class="small" id="cbPrev" aria-label="Претходна реч">←</button> <button class="small" id="cbNext" aria-label="Следећа реч">→</button></div></div>'+cursiveActivityTabs(i,'build')+'<section class="workspace" id="cursiveWordWork"><h2>Сложи реч од слова.</h2>'+letterIllustration(l[2])+'<p class="muted">Модел: <strong class="handwriting cursive-word-model">'+l[1].toLowerCase()+'</strong></p><button class="small" id="listen">♫ Послушај реч</button><div class="slots handwriting" id="cbSlots" aria-label="Сложена реч" aria-live="polite">'+chars.map(()=>'·').join('')+'</div><div class="tiles">'+shuffle(chars.map((c,i)=>({c,i}))).map(x=>'<button class="tile handwriting" data-cb-tile="'+x.i+'" aria-label="Писано слово '+x.c+'">'+x.c+'</button>').join('')+'</div><div class="controls"><button class="secondary" id="cbUndo">← Врати слово</button><button class="primary" id="cbCheck">Провери</button></div><div class="feedback" id="feedback" role="status"></div><button class="primary" id="cbContinue" hidden>Следећи задатак →</button></section>';bindCursiveActivityTabs(i);bindReader(l[1]);$('#cbBack').onclick=()=>nav('cursive');$('#cbPrev').onclick=()=>cursiveWord(adjacentLetterIndex(letters,i,-1));$('#cbNext').onclick=()=>cursiveWord(adjacentLetterIndex(letters,i,1));$('#cbContinue').onclick=()=>cursiveWriting(cursiveLetters.findIndex(item=>item[0]===l[0]));const update=()=>{$('#cbSlots').textContent=picked.map(x=>chars[x]).join('')+'·'.repeat(chars.length-picked.length)};document.querySelectorAll('[data-cb-tile]').forEach(b=>b.onclick=()=>{if(finished)return;picked.push(+b.dataset.cbTile);b.disabled=true;update()});$('#cbUndo').onclick=()=>{if(finished)return;const n=picked.pop();if(n!==undefined)$('[data-cb-tile="'+n+'"]').disabled=false;update();feedback('')};$('#cbCheck').onclick=()=>{if(finished)return;if(picked.map(x=>chars[x]).join('')!==l[1].toLowerCase()){feedback('Погледај модел и покушај поново. Можеш да вратиш слово.');return}finished=true;const earned=state.earned.includes('cb'+i);award('cb'+i);feedback(earned?'Браво! Поновио си ову вежбу.':'Браво! Освојио си звездицу.');$('#cbContinue').hidden=false;$('#cbUndo').disabled=$('#cbCheck').disabled=true;document.querySelectorAll('[data-cb-tile]').forEach(b=>b.disabled=true);const tab=document.querySelector('[data-cursive-activity="build"]');if(tab&&!tab.textContent.includes('✓'))tab.textContent+=' ✓'};window.scrollTo(0,0);}

function cursiveLesson(i){stopAudio();const [letter,page]=cursiveLetters[i];document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.nav==='cursive'));app.innerHTML='<div class="sectionhead"><button id="cursiveBack" class="small">← Писана слова</button><h2>Писано '+letter+'</h2><div><button id="cursivePrev" class="small" aria-label="Претходно писано слово">←</button> <button id="cursiveNext" class="small" aria-label="Следеће писано слово">→</button></div></div>'+cursiveActivityTabs(letters.findIndex(l=>l[0]===letter),'learn')+'<div class="workspace"><div class="eyebrow">ВЕЛИКО И МАЛО ПИСАНО СЛОВО</div>'+cursiveModel(page)+'<p class="instructions">Погледај оба писана облика. Које је ово слово?</p><div class="choices">'+shuffle([letter,cursiveLetters[(i+7)%30][0],cursiveLetters[(i+13)%30][0]]).map(c=>'<button class="choice" data-cursive-answer="'+c+'">'+c+'</button>').join('')+'</div><div id="feedback" class="feedback" role="status"></div><button class="primary" id="cursiveWrite" hidden>Следећи задатак →</button></div>';
 document.fonts.load('240px BookHandwriting').then(fitCursiveLetterModels);bindCursiveActivityTabs(letters.findIndex(l=>l[0]===letter));$('#cursiveBack').onclick=()=>nav('cursive');$('#cursivePrev').onclick=()=>cursiveLesson(adjacentLetterIndex(cursiveLetters,i,-1));$('#cursiveNext').onclick=()=>cursiveLesson(adjacentLetterIndex(cursiveLetters,i,1));$('#cursiveWrite').onclick=()=>cursiveWord(letters.findIndex(l=>l[0]===letter));document.querySelectorAll('[data-cursive-answer]').forEach(b=>b.onclick=()=>{const correct=b.dataset.cursiveAnswer===letter;b.classList.toggle('good',correct);b.classList.toggle('bad',!correct);feedback(correct?'Тачно! Сада сложи реч од писаних слова.':'Погледај облик још једном и покушај поново.');if(correct){document.querySelectorAll('[data-cursive-answer]').forEach(x=>x.disabled=true);award('c'+i+'-recognize');$('#cursiveWrite').hidden=false}});window.scrollTo(0,0);
}
function cursiveWriting(i){stopAudio();const [letter,page]=cursiveLetters[i];app.innerHTML='<div class="sectionhead"><button id="cwBack" class="small">← Писано '+letter+'</button><h2>Вежба писања</h2><div><button class="small" id="cwPrev" aria-label="Претходно писано слово">←</button> <button class="small" id="cwNext" aria-label="Следеће писано слово">→</button></div></div>'+cursiveActivityTabs(letters.findIndex(l=>l[0]===letter),'trace')+'<section class="workspace"><p class="instructions">Цртај преко бледог слова. Одрасли може да ти покаже покрете.</p><div class="canvaswrap"><canvas id="drawing" width="900" height="330" aria-label="Површина за вежбање писаног слова '+letter+'"></canvas></div><div class="controls"><button id="cwClear" class="secondary">Обриши</button><button id="cwDone" class="primary">Заврши вежбу</button><button id="cwDownload" class="small">Преузми цртеж</button></div><p class="muted">Ово је слободна вежба писања. Апликација не оцењује облик слова.</p><div id="feedback" class="feedback" role="status"></div></section>';bindCursiveActivityTabs(letters.findIndex(l=>l[0]===letter));const drawing=setupCanvas(''),canvas=$('#drawing'),ctx=canvas.getContext('2d');let ready=false;const reset=()=>{drawing.reset();ctx.strokeStyle='#dce3d5';ctx.lineWidth=2;[65,265].forEach(y=>{ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(870,y);ctx.stroke()});if(ready){const text=letter+' '+letter.toLowerCase(),p=cursivePairLayout(text,760,270);ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#006ca6';ctx.font=p.size+'px BookHandwriting';ctx.fillText(text,p.x+70,p.y+30);ctx.restore()}};canvas.style.pointerEvents='none';document.fonts.load('240px BookHandwriting').then(()=>{if(!canvas.isConnected)return;ready=true;reset();canvas.style.pointerEvents='auto'});$('#cwBack').onclick=()=>cursiveLesson(i);$('#cwPrev').onclick=()=>cursiveWriting(adjacentLetterIndex(cursiveLetters,i,-1));$('#cwNext').onclick=()=>cursiveWriting(adjacentLetterIndex(cursiveLetters,i,1));$('#cwClear').onclick function cursiveNormalize(s){const latin={'a':'а','b':'б','v':'в','g':'г','d':'д','đ':'ђ','e':'е','ž':'ж','z':'з','i':'и','j':'ј','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','r':'р','s':'с','t':'т','ć':'ћ','u':'у','f':'ф','h':'х','c':'ц','č':'ч','š':'ш'};return s.trim().toLowerCase().replace(/lj/g,'љ').replace(/nj/g,'њ').replace(/dž/g,'џ').replace(/[a-zđžćčš]/g,c=>latin[c]||c).replace(/[.!?]/g,'').trim()}
function cursivePuzzle(i,kind){stopAudio();cursiveTab='games';const p=cursivePuzzles[i],indices=kind==='riddle'?[0,1,2,3,4,5,15,16,17]:[6,7,8,9,10,11,12,13,14],position=indices.indexOf(i);app.innerHTML='<div class="sectionhead"><button id="cursiveGameBack" class="small">← Игре писаних слова</button><h2>'+(kind==='riddle'?'Загонетке':'Ребуси')+'</h2><span class="muted">'+(position+1)+' / '+indices.length+'</span></div><div class="workspace"><p class="storytext">'+bookEsc(p.prompt)+'</p>'+(p.choices?'<div class="choices">'+shuffle(p.choices).map(c=>'<button class="choice word" data-puzzle-choice="'+c+'">'+c+'</button>').join(''):'<form id="cursivePuzzleForm"><label for="cursivePuzzleAnswer">Напиши решење</label><input id="cursivePuzzleAnswer" class="cursive-answer" autocomplete="off" maxlength="30"><button class="primary" type="submit">Провери</button></form>')+'<div id="feedback" class="feedback" role="status"></div><div class="controls"><button id="cursivePuzzleNext" class="small">'+(position===indices.length-1?'Назад на игре':'Следећи задатак →')+'</button></div></div>';
 let finished=false;function check(value,b){if(finished)return;const good=p.answers.includes(cursiveNormalize(value));if(b)b.classList.toggle(good?'good':'bad',true);feedback(good?'Браво, тачно!':'Покушај поново.');if(good){finished=true;award('cq'+i);document.querySelectorAll('[data-puzzle-choice]').forEach(x=>x.disabled=true);const input=$('#cursivePuzzleAnswer');if(input)input.disabled=true;}}
 document.querySelectorAll('[data-puzzle-choice]').forEach(b=>b.onclick=()=>check(b.dataset.puzzleChoice,b));const form=$('#cursivePuzzleForm');if(form)form.onsubmit=e=>{e.preventDefault();check($('#cursivePuzzleAnswer').value)};$('#cursiveGameBack').onclick=()=>nav('cursive');$('#cursivePuzzleNext').onclick=()=>position===indices.length-1?nav('cursive'):cursivePuzzle(indices[position+1],kind);window.scrollTo(0,0);
}

function taskPicture(n,box){return '<img class="native-task-picture" src="'+taskPictures[box.join(',')]+'" alt="Слика из задатка">'}
function nativeShell(g,extra=''){stopAudio();cursiveTab='games';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.nav==='cursive'));app.innerHTML='<div class="sectionhead"><button id="ngBack" class="small">← Игре писаних слова</button><h2>'+g.title+'</h2></div><section class="workspace native-workspace"><div id="ngBody">'+extra+'</div><div id="feedback" class="feedback" role="status"></div><div class="controls"><button id="ngReplay" class="small">Почни поново</button><button id="ngReturn" class="secondary">Све игре</button></div></section>';$('#ngBack').onclick=$('#ngReturn').onclick=()=>nav('cursive');$('#ngReplay').onclick=()=>{state.gameWork[g.id]={};save();nativeGame(g.id)};window.scrollTo(0,0)}
function nativeGame(id){const g=nativeGames.find(g=>g.id===id);if(!g)return;nativeShell(g);({quiz:nativeQuiz,crossword:nativeCrossword,wordsearch:nativeWordsearch,connect:nativeConnect,rabbits:nativeRabbits,maze:nativeMaze,order:nativeOrder,wordbox:nativeWordbox,sentences:nativeSentences,creative:nativeCreative}[g.type])(g)}
function nativeQuiz(g){const s=nativeWork(g.id);s.index??=0;let done=false;function render(){done=false;const i=s.index;if(i>=g.rounds.length){$('#ngBody').innerHTML='<h3>✓ Сви задаци су решени!</h3><p>'+g.rounds.length+' / '+g.rounds.length+'</p>'+(g.cipher?'<p class="handwriting native-big">Наћи ћеш ђеврек у џиновом џепу.</p>':'');return}const r=g.rounds[i],answers=Array.isArray(r[1])?r[1]:[r[1]];$('#ngBody').innerHTML='<p class="muted">'+(i+1)+' / '+g.rounds.length+'</p>'+(g.intro?'<details class="native-story"><summary>Прочитај причу</summary><p>'+g.intro+'</p></details>':'')+(r[3]?taskPicture(g.id,r[3]):'')+(g.cipher?'<div class="native-code-key">'+Array.from(nativeAlphabet).map((c,j)=>'<span><b class="handwriting">'+c.toLowerCase()+'</b><small>'+(j+1)+'</small></span>').join('')+'</div><p>Коју реч крију ови бројеви?</p>':'')+'<p class="storytext">'+bookEsc(r[0])+'</p>'+(r[2]?'<div class="choices">'+shuffle(r[2]).map(c=>'<button class="choice word handwriting" data-ng-answer="'+bookEsc(c)+'">'+bookEsc(c)+'</button>').join(''):'<form id="ngForm"><label for="ngInput">Напиши реч</label><input id="ngInput" class="cursive-answer handwriting" autocomplete="off"><button class="primary" type="submit">Провери</button></form>')+'<button id="ngNext" class="secondary" hidden>Следећи задатак →</button>';feedback('');function check(value,b){if(done)return;const good=answers.includes(cursiveNormalize(value));if(b)b.classList.add(good?'good':'bad');feedback(good?'Браво, тачно!':'Покушај поново.');if(!good)return;done=true;s.index=i+1;save();if(s.index===g.rounds.length)nativeFinish(g);document.querySelectorAll('[data-ng-answer],#ngInput').forEach(x=>x.disabled=true);$('#ngNext').hidden=false;$('#ngNext').textContent=s.index===g.rounds.length?'Погледај резултат':'Следећи задатак →'}document.querySelectorAll('[data-ng-answer]').forEach(b=>b.onclick=()=>check(b.dataset.ngAnswer,b));if($('#ngForm'))$('#ngForm').onsubmit=e=>{e.preventDefault();check($('#ngInput').value)};$('#ngNext').onclick=render}render()}
function nativeCrossword(g){const s=nativeWork(g.id);s.cells??={};const cols=Math.max(...g.rows.map(([w,start])=>start+w.length));let html='<p>Упиши називе по сликама и описима. Обојена колона открива реч '+(g.id===79?'за оно што шаљемо у коверти':g.id===88?'за камповање':'за још једну птицу')+'.</p><div class="native-cross-wrap"><div class="native-cross" style="--cols:'+cols+'">';g.rows.forEach(([word,start,clue],row)=>{for(let col=0;col<cols;col++){if(col<start||col>=start+word.length){html+='<span class="native-cross-empty"></span>';continue}const key=row+':'+col,fixed=g.fixed?.[key];html+='<input class="handwriting '+(col===g.col?'native-secret':'')+'" data-cross-cell="'+key+'" value="'+bookEsc(fixed||s.cells[key]||'')+'" '+(fixed?'readonly':'')+' maxlength="2" autocomplete="off" aria-label="Ред '+(row+1)+', слово '+(col-start+1)+'">'}});html+='</div></div><ol class="native-cross-clues">'+g.rows.map(([, ,c])=>'<li>'+c+'</li>').join('')+'</ol><button id="ngCheckCross" class="primary">Провери укрштеницу</button><p id="ngSecret" class="handwriting native-big"></p>';$('#ngBody').innerHTML=html;document.querySelectorAll('[data-cross-cell]').forEach(input=>input.oninput=()=>{input.classList.remove('good','bad');s.cells[input.dataset.crossCell]=input.value;save()});$('#ngCheckCross').onclick=()=>{let good=true;document.querySelectorAll('[data-cross-cell]').forEach(input=>{const [row,col]=input.dataset.crossCell.split(':').map(Number),[word,start]=g.rows[row],ok=cursiveNormalize(input.value)===word[col-start];input.classList.toggle('good',ok);input.classList.toggle('bad',!ok);good&&=ok});feedback(good?'Браво! Укрштеница је решена.':'Провери означена поља. Свако поље садржи једно слово.');if(good){$('#ngSecret').textContent='Скривена реч: '+g.secret;nativeFinish(g)}}}
function nativeMakeSearch(g){const size=10,grid=Array.from({length:size},()=>Array(size).fill(''));let seed=g.id;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const directions=[[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1],[1,-1],[-1,1]];const paths={};for(const word of g.words){let placed=false;for(let attempt=0;attempt<1000&&!placed;attempt++){const [dr,dc]=directions[Math.floor(rnd()*8)],row=Math.floor(rnd()*size),col=Math.floor(rnd()*size),points=Array.from(word,(c,i)=>[row+dr*i,col+dc*i]);if(points.every(([r,c],i)=>r>=0&&c>=0&&r<size&&c<size&&(!grid[r][c]||grid[r][c]===word[i]))){points.forEach(([r,c],i)=>grid[r][c]=word[i]);paths[word]=points;placed=true}}if(!placed)throw Error('Could not place '+word)}const alphabet=nativeAlphabet.toLowerCase();grid.forEach(row=>row.forEach((c,j)=>{if(!c)row[j]=alphabet[Math.floor(rnd()*alphabet.length)]}));return {grid,paths}}

function assignmentText(node){const copy=node.cloneNode(true);copy.querySelectorAll('button,input,textarea,select,svg,canvas,.assignment-reader').forEach(el=>el.remove());return copy.textContent.replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'').replace(/_/g,' празно место ').replace(/\+/g,' плус ').replace(/=/g,' једнако ').replace(/·/g,'. ').replace(/[↔→←✓]/g,'').replace(/\s+/g,' ').trim()}
function assignmentItems(){const selectors=['#app .instructions','#app .native-workspace #ngBody > p:not(.muted):not(.native-big)','#app .native-workspace .storytext','#app .native-cross-clues li','#app .native-story p','#app .native-creative label','#app #work > h2','#app #work > p:not(.muted):not(.source)','#app #work .lesson-layout > div > p','#app .workspace > h2','#app .workspace > .storytext','#app .workspace > p:not(.muted):not(.source):not(.eyebrow):not(.native-big)'];return [...new Set(document.querySelectorAll(selectors.join(',')))].flatMap(node=>{if(node.closest('button,.card,.assignment-reader'))return [];const text=assignmentText(node);if(!/[а-яёђјљњћџ]/i.test(text)||/^\d+\s*\/\s*\d+/.test(text)||text.includes('Плава:')||text===currentReader?.dataset.clipText)return [];return [{node,text}]})}
let assignmentPlayer=null,assignmentButton=null,assignmentReadObserver=null,assignmentTimer=null,assignmentSpriteURL=null;
function assignmentRecording(text){const segment=assignmentClips.clips?.[text];if(segment){if(!assignmentSpriteURL){if(assignmentClips.base64){const bytes=Uint8Array.from(atob(assignmentClips.base64),c=>c.charCodeAt(0));assignmentSpriteURL=URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'}))}else assignmentSpriteURL=assignmentClips.src}return {url:assignmentSpriteURL,start:segment[0],end:segment[1]}}const url=recordingURL(text);return url?{url,start:0,end:Infinity}:null}
function clearAssignmentButton(){clearInterval(assignmentTimer);assignmentTimer=null;if(assignmentButton?.isConnected){assignmentButton.textContent='♫ Прочитај';assignmentButton.setAttribute('aria-pressed','false')}}
function speakAssignment(text,button){if(assignmentPlayer&&!assignmentPlayer.paused&&assignmentButton===button){assignmentPlayer.pause();return}const clip=assignmentRecording(text);if(!clip){readerStatus('Снимак овог упутства није доступан.');return}stopAudio();clearAssignmentButton();state.sound=true;save();unlockAudio();if(!assignmentPlayer){assignmentPlayer=new Audio();assignmentPlayer.preload='none';assignmentPlayer.setAttribute('playsinline','')}assignmentButton=button;const player=assignmentPlayer;player.src=clip.url;player.muted=false;player.volume=1;activePlayer=player;player.onloadedmetadata=()=>{try{player.currentTime=clip.start}catch(e){}};player.onplaying=()=>{if(!button.isConnected){player.pause();return}if(player.currentTime<clip.start-.05)player.currentTime=clip.start;button.textContent='■ Заустави';button.setAttribute('aria-pressed','true');clearInterval(assignmentTimer);assignmentTimer=setInterval(()=>{if(player.currentTime>=clip.end||!button.isConnected)player.pause()},40)};player.onpause=player.onended=clearAssignmentButton;player.onerror=()=>{clearAssignmentButton();readerStatus('Снимак упутства није преузет. Повежите се на интернет или довршите преузимање за рад без интернета.')};player.play().catch(e=>{if(e.name!=='AbortError'){clearAssignmentButton();readerStatus('Притисни „Прочитај“ поново да чујеш упутство.')}})}
function setupAssignmentReaders(){if(assignmentReadObserver)return;const controls=new WeakMap();let queued=false;function mount(){queued=false;if(assignmentButton&&!assignmentButton.isConnected){assignmentPlayer?.pause();assignmentPlayer?.removeAttribute('src');assignmentPlayer?.load();assignmentButton=null}for(const {node,text} of assignmentItems()){if(node.closest('.poem-workspace'))continue;const existing=controls.get(node);if(existing?.text===text&&existing.row.isConnected)continue;existing?.row.remove();if(!assignmentClips.clips?.[text]&&!recordingURL(text))continue;const row=document.createElement('div');row.className='assignment-reader';const button=document.createElement('button');button.className='small';button.type='button';button.textContent='♫ Прочитај';button.dataset.assignmentRead='';button.setAttribute('aria-label','Прочитај упутство: '+text);button.setAttribute('aria-pressed','false');button.onclick=()=>speakAssignment(text,button);row.append(button);if(node.matches('li,label'))node.append(row);else node.after(row);controls.set(node,{text,row})}}
 assignmentReadObserver=new MutationObserver(records=>{if(queued||records.every(r=>r.target.nodeType===1&&r.target.closest('.assignment-reader')))return;queued=true;queueMicrotask(mount)});assignmentReadObserver.observe(app,{childList:true,subtree:true,characterData:true});mount()}

let installPrompt=null;
let offlineState={phase:'loading',completed:0,total:0};
let pwaRegistration=null;
const pwaStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;refreshPWAUI()});
window.addEventListener('appinstalled',()=>{installPrompt=null;refreshPWAUI()});
function offlineText(){const s=offlineState;if(s.phase==='ready')return '✓ Све игре, слике, анимације, гласови и видео-приче су преузети. Апликација је спремна за рад без интернета.';if(s.phase==='downloading')return 'Преузимање: '+s.completed+' / '+s.total+' датотека. Останите у апликацији док се преузимање не заврши.';if(s.phase==='loading')return 'Проверавамо рад без интернета…';if(s.phase==='unsupported')return 'За инсталацију отворите објављени сајт у Chrome или Safari прегледачу.';if(s.phase==='error')return (s.message||'Преузимање није завршено.')+(s.missing?.length?' Недостаје '+s.missing.length+' датотека: '+s.missing.slice(0,8).join(', ')+(s.missing.length>8?'…':'')+'.':'');return 'Преузмите цео буквар једном, док имате интернет. Укључене су све слике, анимације, гласови, видео-приче и модели писаних слова.'}
function refreshPWAUI(){const top=document.getElementById('installApp');if(top){top.hidden=pwaStandalone();top.onclick=installBukvar}const status=document.getElementById('offlineStatus');if(status)status.textContent=offlineText();const bar=document.getElementById('offlineProgress');if(bar){bar.hidden=offlineState.phase!=='downloading';bar.max=offlineState.total||1;bar.value=offlineState.completed||0}const button=document.getElementById('downloadOffline');if(button){button.disabled=['loading','downloading','ready','unsupported'].includes(offlineState.phase);button.textContent=offlineState.phase==='ready'?'✓ Преузето':offlineState.phase==='downloading'?'Преузимање…':offlineState.phase==='error'?'Настави преузимање':'Преузми за рад без интернета'}const install=document.getElementById('installBukvarButton');if(install){install.disabled=pwaStandalone();install.textContent=pwaStandalone()?'✓ Апликација је инсталирана':'Додај апликацију';install.onclick=installBukvar}refreshParentNotifications()}
const pwaFiles=['sw.js','index.html','manifest.webmanifest','offline-assets.json','app-icon-192-v2.png','app-icon-512-v2.png','app-icon-maskable-512-v2.png','apple-touch-icon-v2.png'];
let pwaSetupPromise=null;
async function missingPWAResources(){const results=await Promise.all(pwaFiles.map(async file=>{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);try{const response=await fetch(new URL(file,location.href),{cache:'no-store',signal:controller.signal});if(!response.ok)return file;const type=response.headers.get('content-type')||'';if(file!=='index.html'&&type.includes('text/html'))return file;if(file.endsWith('.json')||file.endsWith('.webmanifest')){const data=await response.json();if(file==='offline-assets.json'&&!Array.isArray(data.files))return file}return null}catch(e){return file}finally{clearTimeout(timeout)}}));return results.filter(Boolean)}
function waitForPWAActive(registration){return new Promise((resolve,reject)=>{let timer;const deadline=setTimeout(()=>finish(Error('Припрема траје предуго. Проверите интернет и покушајте поново.')),30000);function finish(error){clearTimeout(deadline);clearInterval(timer);error?reject(error):resolve(registration)}function check(){if(registration.active?.state==='activated')return finish();if(registration.installing?.state==='redundant'||(!registration.installing&&!registration.waiting&&!registration.active))finish(Error('Датотеке за инсталацију нису могле да се сачувају.'))}timer=setInterval(check,150);check()})}
function pwaMessage(type,onMessage){return new Promise(resolve=>{const worker=pwaRegistration?.active;if(!worker){offlineState={phase:'error',message:'Припрема није завршена. Притисните „Настави преузимање“ да покушамо поново.'};refreshPWAUI();resolve(false);return}const channel=new MessageChannel();let timeout,finished=false;function finish(ok){if(finished)return;finished=true;clearTimeout(timeout);channel.port1.close();resolve(ok)}function arm(){clearTimeout(timeout);timeout=setTimeout(()=>{offlineState={phase:'error',message:'Преузимање не одговара. Проверите интернет и притисните „Настави преузимање“.'};refreshPWAUI();finish(false)},60000)}channel.port1.onmessage=event=>{arm();onMessage(event.data);if(event.data.phase!=='downloading')finish(event.data.phase!=='error'&&event.data.phase!=='busy')};arm();try{worker.postMessage({type},[channel.port2])}catch(e){offlineState={phase:'error',message:'Веза са преузимањем је прекинута. Притисните „Настави преузимање“.'};refreshPWAUI();finish(false)}})}
async function setupPWA(){if(pwaSetupPromise)return pwaSetupPromise;pwaSetupPromise=(async()=>{offlineState={phase:'loading'};refreshPWAUI();if(!('serviceWorker'in navigator)||!isSecureContext||!/^https?:$/.test(location.protocol)){offlineState={phase:'unsupported'};refreshPWAUI();return false}try{const existing=await navigator.serviceWorker.getRegistration(location.href);const registration=!navigator.onLine&&existing?.active?existing:await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});pwaRegistration=await waitForPWAActive(registration);watchAppUpdates(pwaRegistration);return await pwaMessage('STATUS',message=>{offlineState=message;refreshPWAUI()})}catch(e){pwaRegistration=null;const missing=navigator.onLine?await missingPWAResources():[];offlineState={phase:'error',message:missing.length?'На сајту недостају или нису исправне датотеке за апликацију: '+missing.join(', ')+'. Поставите их у исти фолдер као index.html.':!navigator.onLine?'За прво преузимање укључите интернет, па притисните „Настави преузимање“.':'Припрема није успела. Проверите везу и слободан простор, па притисните „Настави преузимање“.'};refreshPWAUI();return false}})();try{return await pwaSetupPromise}finally{pwaSetupPromise=null}}
async function downloadBukvarOffline(){if(['downloading','ready','loading'].includes(offlineState.phase))return;if(!pwaRegistration?.active&&!(await setupPWA()))return;if(offlineState.phase==='ready')return;try{await navigator.storage?.persist?.()}catch(e){}offlineState={phase:'downloading',completed:0,total:0};refreshPWAUI();await pwaMessage('DOWNLOAD',message=>{if(message.phase==='busy'){offlineState={phase:'error',message:message.message};refreshPWAUI();return}offlineState=message;refreshPWAUI();if(message.phase==='ready'){document.getElementById('live').textContent='Буквар је преузет и спреман за рад без интернета.';sendParentNotification('Мали Буквар је спреман','Све игре су преузете за рад без интернета.','bukvar-offline-ready')}})}
async function installBukvar(){if(installPrompt){const prompt=installPrompt;installPrompt=null;await prompt.prompt();await prompt.userChoice;refreshPWAUI();return}showInstallHelp()}
function showInstallHelp(){if(document.getElementById('installHelpDialog'))return;const dialog=document.createElement('dialog');dialog.id='installHelpDialog';dialog.className='badge-popup';dialog.setAttribute('aria-labelledby','installHelpTitle');dialog.innerHTML='<div class="badge-popup-head"><h2 id="installHelpTitle">Инсталација Буквара</h2><button class="small" id="closeInstallHelp" aria-label="Затвори" autofocus>✕</button></div><p><strong>Рачунар:</strong> отворите објављену апликацију у Chrome или Edge прегледачу и изаберите „Инсталирај апликацију“ из менија.</p><p><strong>Android:</strong> у Chrome менију ⋮ изаберите „Инсталирај апликацију“ или „Додај на почетни екран“.</p><p><strong>iPhone / iPad:</strong> у Safari изаберите „Подели“ → „Додај на почетни екран“ → „Додај“. Укључите „Отвори као веб-апликацију“ ако је понуђено.</p><p>За рад без интернета: отворите „За родитеље“ и притисните „Преузми за рад без интернета“. Сачекајте потврду да су све датотеке преузете.</p><button class="primary" id="installHelpDone">Разумем</button>';document.body.append(dialog);const close=()=>dialog.close();dialog.querySelector('#closeInstallHelp').onclick=dialog.querySelector('#installHelpDone').onclick=close;dialog.addEventListener('close',()=>dialog.remove(),{once:true});dialog.showModal()}
function renderPWAPanel(){const panel=document.createElement('section');panel.className='tracking-panel pwa-panel';panel.innerHTML='<h3>Инсталација и рад без интернета</h3><p>Додајте Буквар на почетни екран и преузмите све игре за рад без интернета. Звездице и радови се чувају на овом уређају.</p><div class="controls" style="justify-content:flex-start"><button class="primary" id="installBukvarButton">Додај на телефон</button><button class="secondary" id="downloadOffline">Преузми за рад без интернета</button></div><progress id="offlineProgress" hidden></progress><p id="offlineStatus" role="status" aria-live="polite"></p><p class="muted">После додавања иконе, прво преузимање обавите из апликације отворене том иконом. То омогућава да и инсталирана апликација има све датотеке.</p>';app.querySelector('.workspace').before(panel);document.getElementById('downloadOffline').onclick=downloadBukvarOffline;refreshPWAUI()}
const parentBeforePWA=parent;parent=function(){parentBeforePWA();renderPWAPanel()};

document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('page-hidden',document.hidden);if(document.hidden){stopAudio();if(audioContext?.state==='running')audioContext.suspend().catch(()=>{})}});

function parentNotificationPermission(){if(location.protocol==='file:')return 'local';return typeof Notification==='undefined'||!isSecureContext?'unsupported':Notification.permission}
function refreshParentNotifications(){const permission=parentNotificationPermission(),status=$('#parentNotificationStatus'),enable=$('#enableParentNotifications'),test=$('#testParentNotification'),toggle=$('#toggleParentNotifications');if(!status)return;const enabled=permission==='granted'&&state.notifications!==false;
status.textContent=permission==='local'?'Ово је HTML преглед. За обавештења отворите објављену апликацију, затим овде изаберите „Укључи обавештења“ и прихватите дозволу.':permission==='unsupported'?'Обавештења нису доступна у овом прегледачу. Отворите инсталирану апликацију у подржаном прегледачу.':permission==='denied'?'Прегледач је блокирао обавештења. Дозволите их у подешавањима сајта, па покушајте поново.':permission==='granted'?(enabled?'✓ Обавештења су дозвољена и укључена.':'Обавештења су дозвољена, али искључена у апликацији.'):'Притисните „Укључи обавештења“, па изаберите „Дозволи“ у прозору прегледача.';
enable.disabled=['local','unsupported','denied'].includes(permission)||enabled;enable.textContent=enabled?'✓ Укључено':'Укључи обавештења';test.disabled=!enabled||!pwaRegistration?.active;toggle.hidden=permission!=='granted';toggle.textContent=enabled?'Искључи у апликацији':'Укључи у апликацији';const link=$('#openPublishedForNotifications');if(link)link.hidden=permission!=='local';}
async function enableParentNotifications(){if(parentNotificationPermission()==='unsupported')return;try{const permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();if(permission==='granted'){state.notifications=true;save()}refreshParentNotifications()}catch(e){$('#parentNotificationStatus').textContent='Отворите инсталирану апликацију и покушајте поново.'}}
async function sendParentNotification(title,body,tag){if(parentNotificationPermission()!=='granted'||state.notifications===false||!pwaRegistration?.active)return false;try{await pwaRegistration.showNotification(title,{body,tag,icon:'./app-icon-192-v2.png',badge:'./app-icon-192-v2.png'});return true}catch(e){return false}}
function renderPermissionPanel(){const panel=document.createElement('section');panel.className='tracking-panel notification-panel';panel.innerHTML='<h3>Обавештења и дозволе — за родитеље</h3><p>Обавештења обавештавају родитеља када је преузимање за рад без интернета завршено. Апликација не тражи локацију, камеру или микрофон.</p><div class="controls" style="justify-content:flex-start"><button class="secondary" id="enableParentNotifications">Укључи обавештења</button><button class="small" id="testParentNotification">Пробно обавештење</button><button class="small" id="toggleParentNotifications" hidden>Искључи у апликацији</button><a class="small local-notification-link" id="openPublishedForNotifications" href="https://che3aha.github.io/BUKVAR6/" target="_blank" rel="noopener" hidden>Отвори објављену апликацију ↗</a></div><p id="parentNotificationStatus" role="status" aria-live="polite"></p><p class="muted">Дозвола је избор родитеља. На рачунару проверите и дозволе обавештења у прегледачу и подешавањима система. Дозволе мења родитељ. Ова верзија не шаље заказане подсетнике док је апликација затворена.</p>';app.insertBefore(panel,app.querySelector('.pwa-panel')||app.querySelector('.workspace'));$('#enableParentNotifications').onclick=enableParentNotifications;$('#testParentNotification').onclick=async()=>{const sent=await sendParentNotification('Мали Буквар','Пробно обавештење за родитеље.','bukvar-test');$('#parentNotificationStatus').textContent=sent?'Пробно обавештење је послато.':'Обавештење није приказано. Проверите дозволе и подешавања уређаја.'};$('#toggleParentNotifications').onclick=()=>{state.notifications=state.notifications===false;save();refreshParentNotifications()};refreshParentNotifications()}
const parentBeforePermissions=parent;parent=function(){parentBeforePermissions();renderPermissionPanel()};
window.addEventListener('focus',refreshParentNotifications);

document.addEventListener('click',e=>{let b=e.target.closest('[data-nav]');if(b)nav(b.dataset.nav)});$('#sound').onclick=()=>{state.sound=!state.sound;if(state.sound){unlockAudio();tone()}else stopAudio();save()};$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('#live').textContent='Приказ преко целог екрана није доступан.'}};header();home();setupTracking();renderSplash();setupAssignmentReaders();setupPWA();
